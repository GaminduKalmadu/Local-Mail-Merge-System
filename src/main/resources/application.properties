spring.application.name=letter-generator
spring.main.web-application-type=none
spring.config.import=optional:file:.env[.properties]

letter.batch.enabled=${LETTER_BATCH_ENABLED:true}
letter.batch.input-dir=${LETTER_INPUT_DIR:input}
letter.batch.output-dir=${LETTER_OUTPUT_DIR:output}
letter.batch.mode=${LETTER_BATCH_MODE:immediate}

letter.daily.send-enabled=${LETTER_DAILY_SEND_ENABLED:false}
letter.daily.limit=${LETTER_DAILY_LIMIT:100}
letter.daily.zone-id=${LETTER_DAILY_ZONE_ID:Asia/Colombo}
letter.daily.poll-delay-ms=${LETTER_DAILY_POLL_DELAY_MS:60000}
letter.email.enabled=${LETTER_EMAIL_ENABLED:false}
letter.email.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
letter.email.port=${GMAIL_SMTP_PORT:587}
letter.email.username=${GMAIL_USERNAME:}
letter.email.app-password=${GMAIL_APP_PASSWORD:}
letter.email.test-recipient=${LETTER_EMAIL_TEST_RECIPIENT:}
letter.email.subject=${LETTER_EMAIL_SUBJECT:Your letter}
letter.email.body=${LETTER_EMAIL_BODY:Dear {name}, please find your {letterType} letter attached.}
